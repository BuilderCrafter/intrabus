[project]
name = "intrabus"
version = "0.2.2"
description = "General-purpose ZeroMQ communication node with pub/sub, request/reply, registry, heartbeats, stats, and diagnostics"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "BuilderCrafter" }]
keywords = [
    "zeromq",
    "pubsub",
    "rpc",
    "message-bus",
    "communication-node",
    "diagnostics",
    "monitoring",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Networking",
]
dependencies = [
    "pyzmq>=26.0",
]

[project.urls]
Repository = "https://github.com/BuilderCrafter/intrabus"
Issues = "https://github.com/BuilderCrafter/intrabus/issues"

[dependency-groups]
dev = [
    "build>=1.2.0",
    "pytest>=8.0",
    "ruff>=0.8.0",
    "twine>=5.0.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["intrabus"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
